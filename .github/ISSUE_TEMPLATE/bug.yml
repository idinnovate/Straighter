name: Bug
description: For any general issues or unexpected/unintended behavior you come across while using Straighter.
title: "[BUG] PLEASE REPLACE THIS TEXT WITH A SUMMARY OF YOUR ISSUE..."
labels: ["bug"]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Confirmation Checklist
      options:
        - label: I confirm that this issue occurs on the **latest release** of Straighter. You can check what the latest version is [on the `Releases` page](https://github.com/idinnovate/Straighter/releases).
          required: true
        - label: I confirm that this issue has **NOT** already been reported on [the issue tracker](https://github.com/idinnovate/Straighter/issues).
          required: true
        - label: I confirm that this issue is **NOT** a website breakage or compatibility issue (such issues should be reported to [the Phoenix issue tracker](https://github.com/celenityy/Phoenix/issues) instead).
          required: true
        - label: I confirm that this issue does **NOT** occur on the latest release of Mozilla Firefox. You can find the latest `APK`s [here](https://ftp.mozilla.org/pub/fenix/releases/).
          required: true
        - label: I confirm that this issue does **NOT** occur on the latest release of Mozilla Firefox **Nightly**. You can find the latest `APK`s [here](https://ftp.mozilla.org/pub/fenix/nightly/).
          required: true

  - type: textarea
    id: android
    attributes:
      label: What version of Android are you using with Straighter?
      description: |
        Steps will vary depending on your OEM, but on AOSP, this can be typically be found by navigating to your `Settings` app -> `About (`phone` or `tablet`, depending on your device)` -> `Device details` -> `Android version`.
    validations:
      required: true

  - type: textarea
    id: version
    attributes:
      label: What version of Straighter are you using?
      description: |
        An easy way to tell is by navigating to `Settings` -> `About` -> `About Straighter`.
    validations:
      required: true

  - type: textarea
    id: first-version
    attributes:
      label: If you remember, what version of Straighter did you first notice the issue on?
    validations:
      required: false

  - type: textarea
    id: addons
    attributes:
      label: Please share a list of your currently installed browser add-ons/extensions, as well as the versions you have installed.
      description: |
        You can find (and copy or screenshot) this information from the `Add-ons` section of `about:support`.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Please explain the issue you are experiencing.
      description: |
        Be sure to include as many relevant details as possible! :)
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Please provide detailed steps to reproduce the issue.
      description: |
        Please be as specific as possible. For example, don't just say that an issue occurs on "all websites", provide specific websites where you encounter the problem.
    validations:
      required: true
